version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: semantic_search
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "9432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # psql -U user -d semantic_search
volumes:
  postgres_data: