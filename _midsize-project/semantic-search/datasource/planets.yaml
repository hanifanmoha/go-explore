topic: Planets
items:
- title: Mercury
  description: Mercury is the smallest planet in our solar system and the closest to the Sun. It has a rocky surface covered in craters, similar to Earth's Moon. Mercury has extreme temperature variations, from scorching hot during the day to freezing at night. It has no atmosphere to retain heat or protect from solar radiation. Mercury orbits the Sun in just 88 Earth days, making its year very short.
- title: Venus
  description: Venus is the second planet from the Sun and is often called Earth's twin due to its similar size. It has a thick atmosphere composed mostly of carbon dioxide, creating a greenhouse effect. Venus is the hottest planet in the solar system, with surface temperatures hot enough to melt lead. It rotates backwards compared to most planets, with a day longer than its year. Venus is covered in volcanoes and has no moons.
- title: Earth
  description: Earth is the third planet from the Sun and the only known planet to harbor life. It has a diverse atmosphere with 21% oxygen, essential for most living organisms. Earth's surface is 71% water, with continents, oceans, and a variety of climates. It has one moon that influences tides and stabilizes the planet's rotation. Earth is home to millions of species and human civilization.
- title: Mars
  description: Mars is the fourth planet from the Sun, known as the Red Planet due to its iron oxide surface. It has the largest volcano in the solar system, Olympus Mons, and a canyon system called Valles Marineris. Mars has a thin atmosphere and polar ice caps made of water and carbon dioxide. It has two small moons, Phobos and Deimos, which are irregularly shaped. Mars is a target for exploration due to potential past water and future colonization.
- title: Jupiter
  description: Jupiter is the fifth planet from the Sun and the largest in the solar system. It is a gas giant composed mostly of hydrogen and helium, with a Great Red Spot storm. Jupiter has at least 79 moons, including the four largest Galilean moons. Its strong magnetic field creates intense radiation belts. Jupiter acts as a protective shield for inner planets by attracting asteroids and comets.
- title: Saturn
  description: Saturn is the sixth planet from the Sun, famous for its prominent ring system. It is a gas giant with a low density, making it less dense than water. Saturn has over 80 moons, including Titan, which has a thick atmosphere. The rings are made of ice and rock particles, ranging in size from tiny grains to large boulders. Saturn's rotation causes it to bulge at the equator.
- title: Uranus
  description: Uranus is the seventh planet from the Sun and an ice giant with a tilted axis. It rotates on its side, possibly due to a collision in its early history. Uranus has a faint ring system and 27 known moons. Its atmosphere contains methane, giving it a blue-green color. Uranus is extremely cold, with temperatures around -224 degrees Celsius.
- title: Neptune
  description: Neptune is the eighth and farthest planet from the Sun in our solar system. It is an ice giant with strong winds, reaching speeds of up to 2,100 km/h. Neptune has 14 known moons, including Triton, which orbits backwards. Its deep blue color comes from methane in the atmosphere. Neptune was discovered through mathematical predictions rather than direct observation.
